name: publish-registry

# Keep the MCP Registry listing in sync with the shipped server.json.
# The namespace ai.greyridgesignals/* is DNS-verified (TXT record on
# greyridgesignals.ai), so the registry authenticates us with the namespace
# signing key — no interactive login, no human in the loop. The key lives in the
# MCP_DNS_PRIVATE_KEY repo secret (hex ed25519 seed; grants registry-publish for
# our namespace only, revocable by rotating the DNS TXT record). Edit server.json,
# bump the version, push; the live discovery surface updates itself.
on:
  push:
    branches: [master, main]
    paths:
      - server.json
      - .github/workflows/publish-registry.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz"
          tar xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --help >/dev/null

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate via DNS (namespace signing key)
        run: ./mcp-publisher login dns --domain greyridgesignals.ai --private-key "$MCP_DNS_PRIVATE_KEY"
        env:
          MCP_DNS_PRIVATE_KEY: ${{ secrets.MCP_DNS_PRIVATE_KEY }}

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
