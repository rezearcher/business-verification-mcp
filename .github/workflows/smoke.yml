name: smoke

# Live maintenance canary: a real MCP client handshake + a live verification + a
# live OFAC load on every push and daily. If an official source changes shape or
# a canary entity goes missing, the roundtrip fails and an issue is opened
# automatically — the maintenance signal, not a silent log.
on:
  push:
    branches: [master, main]
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: MCP client roundtrip + live verification
        id: test
        run: node test/roundtrip.mjs
      - name: Open maintenance issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'smoke: MCP roundtrip or live source failing';
            const body = [
              'The scheduled smoke test failed — an MCP roundtrip assertion or a live official-source check did not pass.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Likely a Socrata dataset shape/ID drift (src/sources/*.js) or an OFAC SDN export format change (src/sanctions.js).',
            ].join('\n');
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'smoke',
            });
            if (existing.some((i) => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['smoke'],
            });
